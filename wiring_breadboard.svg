<text class="sm" x="474" y="396" dominant-baseline="central">브레드보드:</text>
<text class="sm" x="474" y="412" dominant-baseline="central" style="fill:#D7392F">빨간 줄 = +</text>
<text class="sm" x="474" y="428" dominant-baseline="central" style="fill:#2F6FD0">파란 줄 = −</text>
<text class="sm" x="474" y="444" dominant-baseline="central">(가로로 쭉 연결됨)</text>
<text class="sm" x="474" y="466" dominant-baseline="central">줄 순서는 제품마다 달라요.</text>
<text class="sm" x="474" y="482" dominant-baseline="central">위치 말고 인쇄된 색 기준!</text>
<text class="sm" x="474" y="498" dominant-baseline="central">가운데가 끊긴 줄이면</text>
<text class="sm" x="474" y="514" dominant-baseline="central">점퍼선으로 이어 줘요.</text>

